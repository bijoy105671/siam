name: Fix tenant RLS policy SQL
on:
  push:
    branches: [production-upgrade-v1]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-upgrade-v1
      - name: Fix policy
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('server/schema.sql')
          s=p.read_text()
          old="EXECUTE format('CREATE POLICY tenant_isolation ON %I FOR ALL USING (organization_id = NULLIF(current_setting(''app.organization_id'', true), )::uuid) WITH CHECK (organization_id = NULLIF(current_setting(app.organization_id, true), )::uuid)', t);"
          new="EXECUTE format('CREATE POLICY tenant_isolation ON %I FOR ALL USING (organization_id = NULLIF(current_setting(''app.organization_id'', true), '''')::uuid) WITH CHECK (organization_id = NULLIF(current_setting(''app.organization_id'', true), '''')::uuid)', t);"
          if old not in s:
              raise SystemExit('Expected malformed policy SQL was not found')
          p.write_text(s.replace(old,new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/schema.sql
          git commit -m "Fix tenant RLS policy SQL [tenant-rls-fix]"
          git push origin production-upgrade-v1
          rm -f .github/workflows/fix-tenant-rls.yml
          git add -u .github/workflows/fix-tenant-rls.yml
          git commit -m "Remove one-time tenant RLS fix workflow [tenant-rls-fix]"
          git push origin production-upgrade-v1
